# Единый стек VitalsBackend перенесён в корень репозитория.
#
# Запуск всего бэкенда одной командой (из корня VitalsBackend):
#   docker compose up --build -d
#
# Остановка:
#   docker compose down
#
# Логи Gateway:
#   docker compose logs -f apigateway
#
# Этот файл оставлен для обратной совместимости путей в документации.

include:
  - path: ../../docker-compose.yml
