services:
  postgres-routing:
    image: postgres:15
    container_name: vitals-postgres-routing
    environment:
      POSTGRES_DB: RoutingDb
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres123
    ports:
      - "5436:5432"
    volumes:
      - postgres-routing-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - vitals-network

  routing.api:
    build:
      context: .
      dockerfile: RoutingService.API/Dockerfile
    container_name: vitals-routing
    environment:
      - ASPNETCORE_ENVIRONMENT=Docker
      - ASPNETCORE_URLS=http://+:80
      - ConnectionStrings__DefaultConnection=Host=postgres-routing;Port=5432;Database=RoutingDb;Username=postgres;Password=postgres123
      - MedicalRecordService__BaseUrl=http://medicalrecordservice.api:80
      - Jwt__JwksUrl=http://authservice.api:80/internal/jwks
    ports:
      - "5005:80"
    depends_on:
      postgres-routing:
        condition: service_healthy
    networks:
      - vitals-network

volumes:
  postgres-routing-data:

networks:
  vitals-network:
    driver: bridge
