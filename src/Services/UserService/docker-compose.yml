version: '3.8'

services:
  postgres-user:
    image: postgres:15
    container_name: vitals-postgres-user
    environment:
      POSTGRES_DB: UserServiceDb
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres123
    ports:
      - "5432:5432"
    volumes:
      - postgres-user-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - vitals-network

  redis:
    image: redis:7-alpine
    container_name: vitals-redis
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - vitals-network

  userservice:
    build:
      context: .
      dockerfile: UserService.API/Dockerfile
    container_name: vitals-userservice
    environment:
      - ASPNETCORE_ENVIRONMENT=Docker
      - ASPNETCORE_URLS=http://+:80
      - ConnectionStrings__DefaultConnection=Host=postgres-user;Port=5432;Database=UserServiceDb;Username=postgres;Password=postgres123
      - Encryption__Key=0123456789abcdef0123456789abcdef
      - Encryption__IV=0123456789abcdef
    ports:
      - "5001:80"
    depends_on:
      postgres-user:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - vitals-network

volumes:
  postgres-user-data:
  redis-data:

networks:
  vitals-network:
    driver: bridge